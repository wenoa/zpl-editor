name: zplab dist

# Every push to web-component that changes what goes into <zplab-editor> builds it into its own
# branch, release/<short commit hash>: one commit on top of the built one, holding only the package.
# An app installs a build with "@wenoa/zplab": "github:wenoa/zpl-editor#release/<short commit hash>".
on:
  push:
    branches: [web-component]
    paths:
      - src/**
      - packages/**
      - web-component/**
      - vite.config.ts
      - vite.element.config.ts
      - .github/workflows/zplab-dist.yml
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig*.json

permissions:
  contents: write

jobs:
  dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm exec vite build --config vite.element.config.ts
      - run: cp LICENSE web-component/

      - working-directory: web-component
        run: npm version "0.0.0-${GITHUB_SHA::7}" --no-git-tag-version

      - uses: fregante/setup-git-user@v2

      - name: Commit the package to its release branch
        run: |
          branch="release/${GITHUB_SHA::7}"
          dist="$RUNNER_TEMP/release"
          git worktree add -b "$branch" "$dist" "$GITHUB_SHA"
          git -C "$dist" rm -rq .
          cp -R web-component/package.json web-component/index.d.ts web-component/LICENSE web-component/dist "$dist/"
          git -C "$dist" add -A
          git -C "$dist" commit -qm "zplab build"
          git -C "$dist" push origin "$branch"
